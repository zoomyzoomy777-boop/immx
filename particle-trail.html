<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Particle Trail · zoomyyz R&amp;D</title>
<meta name="description" content="Mouse-driven WebGL particle trail with live controls and canvas recording for compositing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@300;400;500&display=swap">
<style>
:root{
  --void:#000;
  --ink:#0b0418;
  --violet:#7101ff;
  --magenta:#4cff16;
  --rec:#ff2d55;
  --fg:#fff;
  --muted:#a59cc4;
  --line:rgba(255,255,255,.14);
  --display:"Michroma","Archivo","Noto Sans Thai",system-ui,sans-serif;
  --body:"Archivo","Noto Sans Thai",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans Thai",ui-monospace,Menlo,monospace;
  --panel:310px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

/* STAGE */
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#050208;
  background-image:linear-gradient(45deg,#0c0812 25%,transparent 25%,transparent 75%,#0c0812 75%),linear-gradient(45deg,#0c0812 25%,transparent 25%,transparent 75%,#0c0812 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
#c{display:block;touch-action:none;cursor:none;background:transparent}
body.window #c{width:100%;height:100%}

/* TOP BAR */
.top{position:fixed;top:0;left:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;pointer-events:none}
.top > *{pointer-events:auto}
.back{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .25s}
.back:hover{border-color:var(--magenta)}
.title{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-shadow:0 1px 8px #000}
.title b{color:var(--violet);font-weight:400}
.title .by{font-family:var(--body);font-size:12px;letter-spacing:.04em;color:var(--muted);margin-left:4px}

/* HINT */
.hint{position:fixed;left:calc(50% - var(--panel) / 2);bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:15;color:var(--muted);text-align:center;pointer-events:none;transition:opacity .6s;white-space:nowrap}
.hint kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--fg)}
.hint.gone{opacity:0}

/* STATUS (bottom-left) */
.status{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.rec{border-color:var(--rec)}
.status.rec .dot{background:var(--rec);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
#countdown{position:fixed;inset:0;z-index:30;display:none;place-items:center;font-family:var(--display);font-size:min(30vw,220px);color:rgba(255,255,255,.85);pointer-events:none;text-shadow:0 0 40px var(--violet)}
#countdown.on{display:grid}

/* PANEL */
.panel{position:fixed;top:0;right:0;bottom:0;z-index:25;width:var(--panel);max-width:100vw;display:flex;flex-direction:column;background:rgba(8,3,20,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-left:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
body.hide-ui .panel{transform:translateX(100%)}
body.hide-ui .hint{opacity:0;pointer-events:none}
body.hide-ui .hint{left:50%}
body.hide-ui .top{opacity:.35}
body.hide-ui .top:hover{opacity:1}
.top,.status{transition:opacity .3s}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line)}
.panel header .mono{color:var(--magenta)}
.iconbtn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer;transition:border-color .25s}
.iconbtn:hover{border-color:var(--magenta)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 24px;scrollbar-width:thin;scrollbar-color:#3a2a5c transparent}
.toggle-ui{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:24;display:none}
body.hide-ui .toggle-ui{display:grid;background:rgba(0,0,0,.55)}
body.recording.hide-ui .toggle-ui{opacity:.25}

details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0 12px;font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:14px}
details[open] summary::after{content:"–"}
.sec{display:grid;gap:12px;padding-bottom:16px}

.row{display:grid;gap:5px}
.row .lbl{display:flex;justify-content:space-between;gap:8px;color:#dcd6f2;font-size:12.5px}
.row .lbl output{font-family:var(--mono);font-size:11px;color:var(--muted)}
.row.inline{grid-template-columns:1fr auto;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--violet) var(--p,50%),rgba(255,255,255,.18) var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:2px;background:var(--violet)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(113,1,255,.45)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 3px rgba(113,1,255,.45)}
select{width:100%;padding:7px 10px;background:#120a24;border:1px solid var(--line);border-radius:5px;cursor:pointer}
input[type=color]{width:44px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.switch{position:relative;width:36px;height:20px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.16);transition:.25s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.25s}
.switch input:checked + span{background:var(--violet)}
.switch input:checked + span::after{transform:translateX(16px)}
.switch input:focus-visible + span{outline:2px solid var(--magenta);outline-offset:2px}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.03);cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;transition:border-color .25s,background .25s}
.btn:hover{border-color:var(--magenta)}
.btn.wide{grid-column:1/-1}
.btn.rec{padding:12px;border-color:rgba(255,45,85,.6);background:rgba(255,45,85,.08);font-size:12px}
.btn.rec .dot{width:10px;height:10px;border-radius:50%;background:var(--rec)}
.btn.rec:hover{border-color:var(--rec);background:rgba(255,45,85,.16)}
body.recording .btn.rec .dot{border-radius:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.note b{color:#dcd6f2;font-weight:500}
.bgimgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgimgs button{aspect-ratio:16/10;padding:0;border:1px solid var(--line);border-radius:5px;background:#120a24 center/cover no-repeat;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;transition:border-color .2s}
.bgimgs button:hover{border-color:rgba(255,255,255,.5)}
.bgimgs button[aria-checked="true"]{border-color:var(--magenta);box-shadow:0 0 0 1px var(--magenta)}
.takes{display:grid;gap:6px}
.takes a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:5px;font-family:var(--mono);font-size:11px;color:#dcd6f2}
.takes a:hover{border-color:var(--magenta)}
.takes a span{color:var(--muted)}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);z-index:40;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(8,3,20,.95);transition:transform .35s cubic-bezier(.2,.7,.2,1);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}

@media (max-width:1100px){.hint{display:none}}
@media (max-width:760px){
  :root{--panel:100vw}
  .panel{top:auto;height:58vh;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  body.hide-ui .panel{transform:translateY(100%)}
  .hint{display:none}
  .title{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="window">

<div id="stage"><canvas id="c" aria-label="Particle trail canvas"></canvas></div>

<div class="top">
  <a class="back mono" href="rnd.html" data-i18n="pt.back">← R&amp;D</a>
  <span class="title">Particle Trail<b>.</b> <span class="by">by zoomyyz</span></span>
  <div class="status mono" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
</div>

<p class="hint mono" id="hint" data-i18n="pt.hint">Move to draw · <kbd>R</kbd> record · <kbd>H</kbd> hide panel · <kbd>C</kbd> clear</p>

<div id="countdown"></div>
<div class="toast mono" id="toast" role="status" aria-live="polite"></div>
<button class="iconbtn toggle-ui" id="showUi" type="button" aria-label="Show panel">☰</button>

<aside class="panel" id="panel" aria-label="Particle controls">
  <header>
    <span class="mono">Controls</span>
    <button class="iconbtn" id="hideUi" type="button" aria-label="Hide panel (H)">✕</button>
  </header>
  <div class="scroll" id="controls"></div>
</aside>

<script src="i18n.js"></script>
<script>
(() => {
'use strict';

/* ============================================================
   SETTINGS
   ============================================================ */
const STORE_KEY = 'zoomyyz-particle-trail-v1';
const COUNT = 320000;            // particle ring buffer (same as the original pen)

const DEFAULTS = {
  // look
  preset:'violet', color:'#1a00ff', intensity:3.9, rainbow:false, hueSpeed:0.25,
  size:0.05, minSize:1, blur:1, minFlashingSpeed:0.1,
  // motion
  speed:0.012, fadeSpeed:1.1, shortRangeFadeSpeed:1.3, spread:7, maxSpread:5,
  far:10, maxZ:100, maxDiff:100, diffPow:0.24, perMove:800, scale:1,
  // auto path
  path:'off', pathSpeed:1, pathSize:0.6,
  // output
  bg:'black', bgColor:'#000000', res:'window', fps:60,
  // background image (drawn into the canvas, so it is recorded too)
  bgImg:false, bgImgSrc:'img/tonkao-painting.webp', bgDim:0.4,
  // record
  format:'auto', bitrate:40, countdown:3,
};

const PRESETS = {
  violet:  {color:'#1a00ff', intensity:3.9, rainbow:false},
  gold:    {color:'#ff8a1a', intensity:2.2, rainbow:false},
  ice:     {color:'#2fb8ff', intensity:2.4, rainbow:false},
  ember:   {color:'#ff320a', intensity:2.6, rainbow:false},
  toxic:   {color:'#4cff16', intensity:1.8, rainbow:false},
  white:   {color:'#ffffff', intensity:1.2, rainbow:false},
  rainbow: {color:'#ffffff', intensity:2.5, rainbow:true},
};

const RESOLUTIONS = {
  window:   null,
  '1080p':  [1920,1080],
  '1440p':  [2560,1440],
  '4k':     [3840,2160],
  vertical: [1080,1920],
  square:   [1080,1080],
};

const BG_IMAGES = [
  ['img/tonkao-painting.webp', 'Tonkao'],
  ['img/about-cloud.webp', 'Nebula'],
  ['work/memories-of-sacrifice/forest.webp', 'Forest'],
  ['work/memories-of-sacrifice/lanterns.webp', 'Lanterns'],
  ['work/memories-of-sacrifice/hero.webp', 'Deer'],
];
const BG_CUSTOM_KEY = 'zoomyyz-particle-trail-bg';   // uploaded image, kept apart from the settings JSON

const BACKGROUNDS = {
  black:[0,0,0,1], green:[0,1,0,1], blue:[0,0.28,1,1], transparent:[0,0,0,0],
};

let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch(e){}
S.path = 'off';                  // auto path never resumes on its own after a reload
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} };

/* ============================================================
   RECORDER FORMAT SUPPORT
   ============================================================ */
const FORMATS = [
  ['mp4',  'MP4 · H.264', ['video/mp4;codecs=avc1.640033','video/mp4;codecs=avc1.4d0033','video/mp4;codecs=avc1','video/mp4']],
  ['vp9',  'WebM · VP9',  ['video/webm;codecs=vp9']],
  ['vp8',  'WebM · VP8',  ['video/webm;codecs=vp8','video/webm']],
];
const canRecord = typeof MediaRecorder !== 'undefined' && !!HTMLCanvasElement.prototype.captureStream;
const supported = {};
if (canRecord) FORMATS.forEach(([id,,types]) => {
  const t = types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch(e){ return false; } });
  if (t) supported[id] = t;
});
function pickMime(){
  if (S.format !== 'auto' && supported[S.format]) return {id:S.format, mime:supported[S.format]};
  // transparent background needs WebM (alpha is only kept by VP8/VP9 in Chromium)
  const order = S.bg === 'transparent' ? ['vp9','vp8','mp4'] : ['mp4','vp9','vp8'];
  const id = order.find(k => supported[k]);
  return id ? {id, mime:supported[id]} : null;
}

/* ============================================================
   WEBGL
   ============================================================ */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {alpha:true, premultipliedAlpha:true, antialias:false, preserveDrawingBuffer:false});
if (!gl) {
  document.getElementById('statusText').textContent = 'WebGL not available';
  return;
}

const VERT = `
precision highp float;
attribute vec3 position;
attribute float random;
attribute vec4 mouse;     // x, y (logical, centred, y up), time, move length
attribute vec2 aFront;

uniform vec2 uHalf;       // half of logical resolution
uniform float unit;       // device px per logical px
uniform float timestamp;
uniform float size, minSize, speed, far, spread, maxSpread, maxZ, maxDiff, diffPow;
uniform float hueSpeed;

varying float vProgress, vRandom, vDiff, vSpreadLength, vPositionZ, vHue;

const float PI = 3.1415926;
const float PI2 = PI * 2.;
const float CAM = 5000.;

float cubicOut(float t){ float f = t - 1.; return f*f*f + 1.; }

void main(){
  float progress = clamp((timestamp - mouse.z) * speed, 0., 1.);

  vec3 startPosition = vec3(mouse.xy, random);

  float diff = mouse.w > 0. ? pow(clamp(mouse.w / maxDiff, 0., 1.), max(diffPow, 0.001)) : 0.;

  vec3 cPosition = position * 2. - 1.;
  float radian = cPosition.x * PI2 - PI;
  vec2 xySpread = vec2(cos(radian), sin(radian)) * spread * mix(1., maxSpread, diff) * cPosition.y;

  vec3 endPosition = startPosition;
  endPosition.xy += xySpread;
  endPosition.xy -= aFront * far * random;
  endPosition.z += cPosition.z * maxZ * (unit > 1. ? 1.2 : 1.);

  vec3 p = mix(startPosition, endPosition, cubicOut(progress * random));

  vProgress = progress;
  vRandom = random;
  vDiff = diff;
  vSpreadLength = cPosition.y;
  vPositionZ = position.z;
  vHue = fract(mouse.z / 60. * hueSpeed + random * 0.04);

  // perspective camera at z = 5000 whose z = 0 plane maps 1:1 to logical pixels
  gl_Position = vec4(p.x / uHalf.x * CAM, p.y / uHalf.y * CAM, 0., CAM - p.z);
  gl_PointSize = diff > 0. ? max(p.z * size * diff * unit, minSize * (unit > 1. ? 1.3 : 1.) * max(1., unit / 2.)) : 0.;
}`;

const FRAG = `
precision highp float;
uniform float fadeSpeed, shortRangeFadeSpeed, minFlashingSpeed, blur;
uniform vec3 baseColor;
uniform float rainbow;
varying float vProgress, vRandom, vDiff, vSpreadLength, vPositionZ, vHue;

float random(vec2 co){
  float dt = dot(co, vec2(12.9898, 78.233));
  return fract(sin(mod(dt, 3.14)) * 43758.5453);
}
vec3 hsv2rgb(vec3 c){
  vec3 p = abs(fract(c.xxx + vec3(0., 2./3., 1./3.)) * 6. - 3.);
  return c.z * mix(vec3(1.), clamp(p - 1., 0., 1.), c.y);
}

void main(){
  vec2 p = gl_PointCoord * 2. - 1.;
  float len = length(p);

  float cRandom = random(vec2(vProgress * mix(minFlashingSpeed, 1., vRandom)));
  cRandom = mix(0.3, 2., cRandom);

  float cBlur = blur * mix(1., 0.3, vPositionZ);
  float shape = smoothstep(1. - cBlur, 1. + cBlur, (1. - cBlur) / len);
  shape *= mix(0.5, 1., vRandom);
  if (shape == 0.) discard;

  float darkness = mix(0.1, 1., vPositionZ);

  float alphaProgress = vProgress * fadeSpeed * mix(2.5, 1., pow(vDiff, 0.6));
  alphaProgress *= mix(shortRangeFadeSpeed, 1., sin(vSpreadLength * 1.5707963) * vDiff * vDiff);
  float alpha = 1. - min(alphaProgress, 1.);
  alpha *= cRandom * vDiff;

  vec3 col = mix(baseColor, hsv2rgb(vec3(vHue, .85, 1.)) * length(baseColor) / 1.732, rainbow);
  gl_FragColor = vec4(col * darkness * cRandom, shape * alpha);
}`;

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
['uHalf','unit','timestamp','size','minSize','speed','far','spread','maxSpread','maxZ','maxDiff','diffPow',
 'hueSpeed','fadeSpeed','shortRangeFadeSpeed','minFlashingSpeed','blur','baseColor','rainbow']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// static attributes
const posData = new Float32Array(COUNT * 3);
const rndData = new Float32Array(COUNT);
for (let i = 0; i < COUNT; i++) {
  posData[i*3] = Math.random(); posData[i*3+1] = Math.random(); posData[i*3+2] = Math.random();
  rndData[i] = Math.random();
}
// dynamic attributes
const mouseData = new Float32Array(COUNT * 4);
const frontData = new Float32Array(COUNT * 2);
function resetBuffers(){
  for (let i = 0; i < COUNT; i++) { mouseData[i*4+2] = -1e7; mouseData[i*4+3] = 0; }
}
resetBuffers();

function attrib(name, data, size, usage){
  const loc = gl.getAttribLocation(prog, name);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  return buf;
}
attrib('position', posData, 3, gl.STATIC_DRAW);
attrib('random', rndData, 1, gl.STATIC_DRAW);
const mouseBuf = attrib('mouse', mouseData, 4, gl.DYNAMIC_DRAW);
const frontBuf = attrib('aFront', frontData, 2, gl.DYNAMIC_DRAW);

gl.disable(gl.DEPTH_TEST);
gl.enable(gl.BLEND);
// additive light; alpha accumulates too so a transparent background keeps a usable matte
gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);

/* ---------- background image: a full-canvas quad drawn before the particles ---------- */
const BG_VERT = `
attribute vec2 corner;
uniform vec2 uvScale;
varying vec2 vUv;
void main(){ vUv = corner * 0.5 * uvScale + 0.5; gl_Position = vec4(corner, 0., 1.); }`;
const BG_FRAG = `
precision mediump float;
uniform sampler2D tex;
uniform float dim;
varying vec2 vUv;
void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb * (1. - dim), 1.); }`;
// WebGL1 has no VAOs, so give the quad an attribute slot the particle program doesn't use
const usedLocs = ['position','random','mouse','aFront'].map(n => gl.getAttribLocation(prog, n));
const BG_LOC = [0,1,2,3,4,5,6,7].find(i => !usedLocs.includes(i));
const bgProg = gl.createProgram();
gl.attachShader(bgProg, shader(gl.VERTEX_SHADER, BG_VERT));
gl.attachShader(bgProg, shader(gl.FRAGMENT_SHADER, BG_FRAG));
gl.bindAttribLocation(bgProg, BG_LOC, 'corner');
gl.linkProgram(bgProg);
const bgU = {uvScale: gl.getUniformLocation(bgProg, 'uvScale'), dim: gl.getUniformLocation(bgProg, 'dim')};
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const bgTex = gl.createTexture();
const bgImage = {ready:false, w:1, h:1, token:0};
let bgCustom = null;
try { bgCustom = localStorage.getItem(BG_CUSTOM_KEY); } catch(e){}
if (S.bgImgSrc === 'custom' && !bgCustom) S.bgImgSrc = BG_IMAGES[0][0];

function loadBgImage(){
  const src = S.bgImgSrc === 'custom' ? bgCustom : S.bgImgSrc;
  const token = ++bgImage.token;
  bgImage.ready = false;
  if (!src) return;
  const img = new Image();
  img.onload = () => {
    if (token !== bgImage.token) return;   // a newer pick replaced this one
    try {
      gl.bindTexture(gl.TEXTURE_2D, bgTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      bgImage.w = img.naturalWidth; bgImage.h = img.naturalHeight; bgImage.ready = true;
    } catch (e) { toast('Could not use that image here'); }
  };
  img.onerror = () => { if (token === bgImage.token) toast('Could not load the background image'); };
  img.src = src;
}

function drawBgImage(){
  if (!S.bgImg || !bgImage.ready) return;
  // cover: fill the canvas and crop the overflow, like background-size:cover
  const ca = W / H, ia = bgImage.w / bgImage.h;
  gl.useProgram(bgProg);
  gl.disable(gl.BLEND);
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(BG_LOC);
  gl.vertexAttribPointer(BG_LOC, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, bgTex);
  gl.uniform2f(bgU.uvScale, ca > ia ? 1 : ca / ia, ca > ia ? ia / ca : 1);
  gl.uniform1f(bgU.dim, S.bgDim);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.disableVertexAttribArray(BG_LOC);
  gl.enable(gl.BLEND);
  gl.useProgram(prog);
}

/* ============================================================
   SIZE / COORDINATES
   ============================================================ */
let W = 0, H = 0, unit = 1, halfW = 0, halfH = 0, sizeLocked = false;
const stage = document.getElementById('stage');

function resize(){
  if (sizeLocked) { fitCanvas(); return; }
  const fixed = RESOLUTIONS[S.res];
  document.body.classList.toggle('window', !fixed);
  let base;
  if (fixed) {
    [W, H] = fixed;
    base = Math.min(W, H) / 1080;
  } else {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    base = dpr;
  }
  unit = base * S.scale;
  halfW = W / unit / 2; halfH = H / unit / 2;
  canvas.width = W; canvas.height = H;
  gl.viewport(0, 0, W, H);
  fitCanvas();
  updateStatus();
}
function fitCanvas(){
  if (!RESOLUTIONS[S.res]) { canvas.style.width = canvas.style.height = ''; return; }
  const k = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  canvas.style.width = (W * k) + 'px';
  canvas.style.height = (H * k) + 'px';
}
addEventListener('resize', resize);

// client px -> logical coords centred on the canvas, y down (matches the original pen)
function toLogical(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return [
    (clientX - r.left) / r.width * W / unit - halfW,
    (clientY - r.top) / r.height * H / unit - halfH,
  ];
}

/* ============================================================
   EMITTER (port of ShootingStar.draw)
   ============================================================ */
const t0 = performance.now();
const now = () => performance.now() - t0;
const TICK = 60 / 1000;           // the original pen's clock counts 60fps frames, not ms
let cursor = 0, old = null;
let dirtyFrom = Infinity, dirtyTo = -1, dirtyAll = false;

function draw(x, yDown){
  const nx = x, ny = -yDown;            // to y-up
  const t = now();
  let dx = 0, dy = 0;
  if (old) { dx = nx - old[0]; dy = ny - old[1]; }
  const length = Math.hypot(dx, dy);
  const fx = length ? dx / length : 0, fy = length ? dy / length : 0;
  const n = Math.max(1, Math.round(S.perMove));
  const ox = old ? old[0] : nx, oy = old ? old[1] : ny;

  for (let i = 0; i < n; i++) {
    const idx = (cursor + i) % COUNT;
    const k = i / n;
    const m = idx * 4, f = idx * 2;
    mouseData[m]   = ox + dx * k;
    mouseData[m+1] = oy + dy * k;
    mouseData[m+2] = t * TICK;
    mouseData[m+3] = length;
    frontData[f]   = fx;
    frontData[f+1] = fy;
  }
  const start = cursor, end = cursor + n;
  if (end > COUNT) dirtyAll = true;
  else { dirtyFrom = Math.min(dirtyFrom, start); dirtyTo = Math.max(dirtyTo, end); }
  cursor = end % COUNT;
  old = [nx, ny];
}

function upload(){
  if (!dirtyAll && dirtyTo < 0) return;
  let from = dirtyFrom, to = dirtyTo;
  if (dirtyAll) { from = 0; to = COUNT; }
  gl.bindBuffer(gl.ARRAY_BUFFER, mouseBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, from * 16, mouseData.subarray(from * 4, to * 4));
  gl.bindBuffer(gl.ARRAY_BUFFER, frontBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, from * 8, frontData.subarray(from * 2, to * 2));
  dirtyFrom = Infinity; dirtyTo = -1; dirtyAll = false;
}

function clearTrail(){
  resetBuffers(); dirtyAll = true; old = null;
}

/* ---------- pointer ---------- */
let lastUserMove = -1e9;
function onMove(e){
  if (e.pointerType === 'touch' && !e.isPrimary) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  (evs.length ? evs : [e]).forEach(ev => { const [x, y] = toLogical(ev.clientX, ev.clientY); draw(x, y); });
  lastUserMove = now();
  hideHint();
}
canvas.addEventListener('pointermove', onMove);
canvas.addEventListener('pointerdown', e => { old = null; const [x, y] = toLogical(e.clientX, e.clientY); draw(x, y); });
canvas.addEventListener('pointerleave', () => { old = null; });

/* ============================================================
   ANIMATION HELPERS (intro + auto paths)
   ============================================================ */
const easeOutQuint = t => 1 - Math.pow(1 - t, 5);
const tweens = [];
function animate(fn, {duration, begin = 0, finish = 1, easing = t => t, onAfter} = {}){
  tweens.push({fn, duration, begin, finish, easing, onAfter, start: now()});
}
function runTweens(t){
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const p = Math.min(1, (t - tw.start) / tw.duration);
    tw.fn(tw.begin + (tw.finish - tw.begin) * tw.easing(p));
    if (p >= 1) { tweens.splice(i, 1); tw.onAfter && tw.onAfter(); }
  }
}

// opening move: the particles write "zoomyyz" in joined-up cursive, one continuous stroke
// glyph control points are in x-height units (0..1, y down, baseline at 1; descender loops reach ~1.85).
// each glyph's first point is where the connector from the previous letter lands.
const GLYPHS = {
  z: {w: 0.75, pts: [[0.1,0.1],[0.32,0],[0.58,0.08],[0.42,0.4],[0.2,0.68],[0.45,0.68],[0.6,0.95],[0.5,1.4],[0.3,1.62],[0.18,1.42],[0.4,1.06],[0.75,0.86]]},
  o: {w: 0.98, pts: [[0.7,0.16],[0.45,0],[0.14,0.16],[0.02,0.55],[0.22,0.96],[0.56,0.92],[0.76,0.5],[0.7,0.08],[0.86,0.15],[1.02,0.16]]},
  m: {w: 1.1,  pts: [[0.1,0.12],[0.2,0.3],[0.18,1],[0.25,0.38],[0.38,0.06],[0.51,0.3],[0.49,1],[0.58,0.38],[0.73,0.06],[0.86,0.3],[0.86,0.84],[0.98,1],[1.13,0.9]]},
  y: {w: 0.85, pts: [[0.12,0.05],[0.04,0.5],[0.16,0.95],[0.4,0.85],[0.6,0.05],[0.56,0.8],[0.45,1.5],[0.25,1.85],[0.1,1.7],[0.25,1.3],[0.6,1],[0.85,0.85]]},
};
const WORD = 'zoomyyz', SLANT = 0.25;

// smooth Catmull-Rom curve through the control points, sampled densely
function catmull(P, seg = 14){
  const out = [P[0]];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || P[i + 1];
    for (let j = 1; j <= seg; j++) {
      const t = j / seg, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(d => 0.5 * (2 * p1[d] + (p2[d] - p0[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (3 * p1[d] - p0[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  return out;
}

function wordPath(){
  const ctrl = [[-0.15, 0.45]];             // small lead-in stroke
  let x0 = 0;
  for (const c of WORD) { GLYPHS[c].pts.forEach(([px, py]) => ctrl.push([x0 + px, py])); x0 += GLYPHS[c].w; }
  const wordW = x0;
  // centre on the part of the canvas not covered by the side panel
  let cx = 0, availW = halfW * 2;
  const pr = document.getElementById('panel').getBoundingClientRect(), cr = canvas.getBoundingClientRect();
  if (!document.body.classList.contains('hide-ui') && pr.left > cr.left && pr.left < cr.right && pr.top <= cr.top + 1) {
    const l = toLogical(cr.left, 0)[0], r = toLogical(pr.left, 0)[0];
    cx = (l + r) / 2; availW = r - l;
  }
  const h = Math.min(availW * 0.8 / wordW, halfH * 2 * 0.36 / 1.85);
  const pts = [];
  let s = 0, prev = null;
  catmull(ctrl).forEach(([px, py], i) => {
    const x = cx + (px + (1 - py) * SLANT - wordW / 2) * h, y = (py - 0.8) * h;
    if (prev) s += Math.hypot(x - prev[0], y - prev[1]);
    pts.push({x, y, s, lift: i === 0});
    prev = [x, y];
  });
  return pts;
}

function playIntro(){
  old = null;
  const pts = wordPath(), total = pts[pts.length - 1].s;
  let k = -1;
  animate(p => {
    const target = p * total;
    while (k + 1 < pts.length && pts[k + 1].s <= target) {
      k++;
      if (pts[k].lift) old = null;
      draw(pts[k].x, pts[k].y);
    }
    const a = pts[k], b = pts[k + 1];
    if (a && b && !b.lift && b.s > a.s) {
      const f = (target - a.s) / (b.s - a.s);
      draw(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f);
    }
  }, {
    duration: Math.max(1800, Math.min(3200, total * 0.6)),
    onAfter(){ old = null; }
  });
}

let pathT = 0, pathWasOn = false;
function runPath(dt){
  const on = S.path !== 'off' && now() - lastUserMove > 600;
  if (!on) { if (pathWasOn) old = null; pathWasOn = false; return; }
  if (!pathWasOn) old = null;
  pathWasOn = true;
  pathT += dt * 0.001 * S.pathSpeed;
  const t = pathT, R = Math.min(halfW, halfH) * S.pathSize;
  let x = 0, y = 0;
  switch (S.path) {
    case 'circle':  x = Math.cos(t * 2) * R; y = Math.sin(t * 2) * R; break;
    case 'eight':   x = Math.sin(t * 1.6) * R * 1.4; y = Math.sin(t * 3.2) * R * 0.6; break;
    case 'wave':    x = Math.sin(t * 0.7) * halfW * 0.92; y = Math.sin(t * 3.1) * R * 0.5; break;
    case 'spiral': { const r = R * (0.15 + 0.85 * (0.5 + 0.5 * Math.sin(t * 0.45))); x = Math.cos(t * 2.6) * r; y = Math.sin(t * 2.6) * r; break; }
    case 'flower': { const r = R * (0.55 + 0.45 * Math.cos(t * 5)); x = Math.cos(t) * r; y = Math.sin(t) * r; break; }
    case 'wander':  x = (Math.sin(t * 0.9) + Math.sin(t * 1.7 + 1) * 0.5) * R * 0.9; y = (Math.cos(t * 1.1) + Math.sin(t * 2.3 + 2) * 0.4) * R * 0.7; break;
  }
  draw(x, y);
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }

let last = now(), snapshotPending = false;
function frame(){
  const t = now(), dt = Math.min(t - last, 100); last = t;
  runTweens(t);
  runPath(dt);
  upload();

  const bg = S.bg === 'custom' ? [...hexToRgb(S.bgColor), 1] : BACKGROUNDS[S.bg] || BACKGROUNDS.black;
  gl.clearColor(bg[0] * bg[3], bg[1] * bg[3], bg[2] * bg[3], bg[3]);
  gl.clear(gl.COLOR_BUFFER_BIT);
  drawBgImage();

  const c = hexToRgb(S.color).map(v => v * S.intensity);
  gl.uniform2f(U.uHalf, halfW, halfH);
  gl.uniform1f(U.unit, unit);
  gl.uniform1f(U.timestamp, t * TICK);
  ['size','minSize','speed','far','spread','maxSpread','maxZ','maxDiff','diffPow','hueSpeed',
   'fadeSpeed','shortRangeFadeSpeed','minFlashingSpeed','blur'].forEach(k => gl.uniform1f(U[k], S[k]));
  gl.uniform3fv(U.baseColor, c);
  gl.uniform1f(U.rainbow, S.rainbow ? 1 : 0);
  gl.drawArrays(gl.POINTS, 0, COUNT);

  if (snapshotPending) { snapshotPending = false; savePng(); }
  if (recorder && recorder.state === 'recording') {
    const s = (performance.now() - recStart) / 1000;
    statusText.textContent = `REC ${fmtTime(s)} · ${W}×${H} · ${S.fps}fps`;
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   RECORDING
   ============================================================ */
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const countdownEl = document.getElementById('countdown');
let recorder = null, recStart = 0, chunks = [], counting = false, countTimer = 0;
const takes = [];

const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function stamp(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
const bgName = () => S.bgImg ? 'image' : S.bg;
function updateStatus(){
  if (recorder && recorder.state === 'recording') return;
  statusText.textContent = `${W}×${H} · ${S.fps}fps · ${bgName()}`;
}

function toggleRecord(){
  if (counting) { cancelCountdown(); return; }
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  if (!canRecord) { toast(t('pt.norec')); return; }
  const fmt = pickMime();
  if (!fmt) { toast(t('pt.norec')); return; }
  const n = Math.round(S.countdown);
  if (n > 0) {
    counting = true; setRecUi();
    let left = n;
    countdownEl.textContent = left; countdownEl.classList.add('on');
    countTimer = setInterval(() => {
      left--;
      if (left <= 0) { cancelCountdown(true); startRecording(fmt); }
      else countdownEl.textContent = left;
    }, 1000);
  } else startRecording(fmt);
}
function cancelCountdown(keep){
  clearInterval(countTimer); counting = false;
  countdownEl.classList.remove('on');
  if (!keep) setRecUi();
}

function startRecording(fmt){
  sizeLocked = true;
  const stream = canvas.captureStream(S.fps);
  chunks = [];
  try {
    recorder = new MediaRecorder(stream, {mimeType: fmt.mime, videoBitsPerSecond: Math.round(S.bitrate * 1e6)});
  } catch (e) {
    sizeLocked = false; toast('Recorder error: ' + e.message); setRecUi(); return;
  }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(tr => tr.stop());
    sizeLocked = false;
    const ext = fmt.id === 'mp4' ? 'mp4' : 'webm';
    const blob = new Blob(chunks, {type: fmt.mime.split(';')[0]});
    const secs = (performance.now() - recStart) / 1000;
    const name = `particle-trail_${W}x${H}_${S.fps}fps_${bgName()}_${stamp()}.${ext}`;
    const url = URL.createObjectURL(blob);
    download(url, name);
    takes.unshift({url, name, secs, mb: blob.size / 1048576});
    renderTakes();
    setRecUi(); updateStatus(); resize();
    toast(`${t('pt.saved')} · ${name}`);
  };
  recorder.start(1000);
  recStart = performance.now();
  setRecUi();
}

function download(url, name){
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function savePng(){
  canvas.toBlob(b => {
    if (!b) return;
    download(URL.createObjectURL(b), `particle-trail_${W}x${H}_${stamp()}.png`);
  }, 'image/png');
}

function setRecUi(){
  const rec = !!(recorder && recorder.state === 'recording');
  document.body.classList.toggle('recording', rec);
  statusEl.classList.toggle('rec', rec);
  const b = document.getElementById('recBtn');
  if (b) b.querySelector('.txt').innerHTML = rec ? t('pt.stop') : counting ? t('pt.cancel') : t('pt.start');
  document.querySelectorAll('[data-lock]').forEach(el => el.disabled = rec || counting);
}

/* ============================================================
   UI
   ============================================================ */
const root = document.getElementById('controls');
const inputs = {};
const el = (tag, attrs = {}, html = '') => { const e = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); if (html) e.innerHTML = html; return e; };

function section(title, open = true){
  const d = el('details'); if (open) d.open = true;
  d.append(el('summary', {}, title));
  const s = el('div', {class: 'sec'}); d.append(s); root.append(d);
  return s;
}
function slider(parent, key, label, min, max, step, digits = 2){
  const row = el('div', {class: 'row'});
  const id = 'in-' + key;
  row.innerHTML = `<label class="lbl" for="${id}"><span>${label}</span><output></output></label>`;
  const inp = el('input', {type: 'range', id, min, max, step});
  const out = row.querySelector('output');
  const paint = () => { inp.style.setProperty('--p', ((inp.value - min) / (max - min) * 100) + '%'); out.textContent = (+inp.value).toFixed(digits); };
  inp.value = S[key]; paint();
  inp.addEventListener('input', () => { S[key] = +inp.value; paint(); onChange(key); });
  row.append(inp); parent.append(row);
  inputs[key] = {set(){ inp.value = S[key]; paint(); }};
}
function select(parent, key, label, options, lock){
  const row = el('div', {class: 'row'});

  sel.value = S[key];
  sel.addEventListener('change', () => { S[key] = isNaN(+sel.value) || sel.value === '' ? sel.value : +sel.value; onChange(key); });
  row.append(sel); parent.append(row);
  inputs[key] = {set(){ sel.value = S[key]; }};
}
function color(parent, key, label){

function button(parent, label, fn, cls = 'btn'){

  /* LOOK */

  slider(s, 'maxZ', 'Depth', 0, 500, 1, 0);
  slider(s, 'maxDiff', 'Speed range', 1, 1000, 1, 0);
  slider(s, 'diffPow', 'Speed curve', 0, 3, 0.01);
  slider(s, 'perMove', 'Particles per move', 50, 2000, 10, 0);
  slider(s, 'scale', 'Overall scale', 0.25, 4, 0.05);

  /* AUTO PATH */
  s = section('Auto path', false);
  s.append(el('p', {class: 'note'}, 'Draws by itself for clean, repeatable takes. Moving the mouse takes over; it resumes after you stop.'));
  select(s, 'path', 'Path', [['off','Off (mouse only)'],['circle','Circle'],['eight','Figure 8'],['wave','Wave sweep'],['spiral','Spiral'],['flower','Flower'],['wander','Wander']]);
  slider(s, 'pathSpeed', 'Path speed', 0.1, 4, 0.05);
  slider(s, 'pathSize', 'Path size', 0.1, 1.2, 0.01);
  const pb = el('div', {class: 'btns'}); s.append(pb);
  button(pb, 'Play intro', playIntro, 'btn wide');

  /* BACKGROUND IMAGE */
  s = section('Background image');
  toggle(s, 'bgImg', 'Show background image');
  const grid = el('div', {class: 'bgimgs', role: 'radiogroup', 'aria-label': 'Background image'});
  s.append(grid);
  const fileIn = el('input', {type: 'file', accept: 'image/*', hidden: ''});
  s.append(fileIn);
  const thumbs = BG_IMAGES.map(([src, name]) => {
    const b = button(grid, '', () => pickBg(src), '');
    b.dataset.src = src; b.title = name;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', name);
    b.style.backgroundImage = `url("${src}")`;
    return b;
  });
  const upBtn = button(grid, '+', () => fileIn.click(), '');
  upBtn.dataset.src = 'custom'; upBtn.title = 'Upload your own';
  upBtn.setAttribute('role', 'radio'); upBtn.setAttribute('aria-label', 'Upload your own');
  thumbs.push(upBtn);
  fileIn.addEventListener('change', () => { const f = fileIn.files[0]; fileIn.value = ''; if (f) uploadBg(f); });
  slider(s, 'bgDim', 'Darken', 0, 0.95, 0.01);
  s.append(el('p', {class: 'note'}, 'The image is drawn inside the canvas, so it shows up in recordings and PNG frames. Turn it off to record on a plain colour for compositing.'));
  inputs.bgImgSrc = {set(){
    thumbs.forEach(b => b.setAttribute('aria-checked', b.dataset.src === S.bgImgSrc));
    if (bgCustom) { upBtn.style.backgroundImage = `url("${bgCustom}")`; upBtn.textContent = ''; }
  }};
  inputs.bgImgSrc.set();

  /* OUTPUT */
  s = section('Output');
  select(s, 'res', 'Resolution', [['window','Fit window'],['1080p','1920×1080 · HD'],['1440p','2560×1440 · QHD'],['4k','3840×2160 · 4K'],['vertical','1080×1920 · vertical'],['square','1080×1080 · square']], true);
  select(s, 'bg', 'Background', [['black','Black · for Add / Screen'],['green','Green screen'],['blue','Blue screen'],['transparent','Transparent (alpha)'],['custom','Custom color']]);
  color(s, 'bgColor', 'Custom background');
  select(s, 'fps', 'Frame rate', [[30,'30 fps'],[60,'60 fps']], true);
  s.append(el('p', {class: 'note'}, '<b>Compositing tip:</b> record on black and set the layer blend mode to <b>Add</b> or <b>Screen</b> in After Effects, Nuke, Resolve or Premiere. Transparent keeps alpha only in WebM (Chrome / Edge).'));

  /* RECORD */
  s = section('Record');
  const fmts = [['auto','Auto']].concat(FORMATS.filter(([id]) => supported[id]).map(([id, name]) => [id, name]));
  select(s, 'format', 'Format', fmts, true);
  slider(s, 'bitrate', 'Bitrate (Mbps)', 4, 120, 1, 0);
  select(s, 'countdown', 'Countdown', [[0,'None'],[3,'3 seconds'],[5,'5 seconds']], true);
  const rb = el('div', {class: 'btns'}); s.append(rb);
  const rec = button(rb, '<span class="dot"></span><span class="txt"></span>', toggleRecord, 'btn rec wide');
  rec.id = 'recBtn';
  if (!canRecord || !Object.keys(supported).length) { rec.disabled = true; }
  button(rb, 'PNG frame', () => { snapshotPending = true; });
  button(rb, 'Clear', clearTrail);
  s.append(el('p', {class: 'note'}, 'Only the canvas is recorded, never this panel or the cursor. Keep this tab in front while recording: browsers pause hidden tabs.'));
  const tk = el('div', {class: 'takes', id: 'takes'}); s.append(tk);

  /* SETTINGS */
  s = section('Settings', false);
  const sb = el('div', {class: 'btns'}); s.append(sb);
  button(sb, 'Copy JSON', () => {
    const txt = JSON.stringify(S, null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Settings copied'), () => toast('Copy failed'));
  });
  button(sb, 'Paste JSON', async () => {
    try {
      const txt = navigator.clipboard && navigator.clipboard.readText ? await navigator.clipboard.readText() : prompt('Paste settings JSON');
      const obj = JSON.parse(txt);
      Object.keys(DEFAULTS).forEach(k => { if (k in obj && typeof obj[k] === typeof DEFAULTS[k]) S[k] = obj[k]; });
      syncAll(); loadBgImage(); resize(); save(); toast('Settings loaded');
    } catch (e) { toast('Could not read settings'); }
  });
  button(sb, 'Reset all', () => { S = Object.assign({}, DEFAULTS); syncAll(); loadBgImage(); resize(); save(); toast('Reset to defaults'); }, 'btn wide');

  setRecUi(); renderTakes(); refreshVisibility();
}

function renderTakes(){
  const box = document.getElementById('takes');
  if (!box) return;
  box.innerHTML = '';
  takes.slice(0, 5).forEach(tk => {
    const a = el('a', {href: tk.url, download: tk.name});
    a.innerHTML = `${fmtTime(tk.secs)} · ${tk.mb.toFixed(1)} MB<span>↓</span>`;
    a.title = tk.name;
    box.append(a);
  });
}

function pickBg(src){
  S.bgImgSrc = src; S.bgImg = true;
  inputs.bgImg.set(); inputs.bgImgSrc.set();
  loadBgImage(); updateStatus(); save();
}
// shrink uploads so they fit in localStorage
async function uploadBg(file){
  try {
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();
    const k = Math.min(1, 2560 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    bgCustom = c.toDataURL('image/jpeg', 0.9);
    try { localStorage.setItem(BG_CUSTOM_KEY, bgCustom); }
    catch (e) { toast('Image too large to remember: it resets on reload'); }
    pickBg('custom');
  } catch (e) { toast('Could not read that image'); }
}

function syncAll(){ Object.values(inputs).forEach(i => i.set()); refreshVisibility(); }
function refreshVisibility(){
  if (inputs.bgColor) inputs.bgColor.row.style.display = S.bg === 'custom' ? '' : 'none';
}

function onChange(key){
  if (key === 'preset' && PRESETS[S.preset]) { Object.assign(S, PRESETS[S.preset]); syncAll(); }
  if (key === 'color' || key === 'intensity' || key === 'rainbow') { S.preset = 'custom'; inputs.preset.set(); }
  if (key === 'res' || key === 'scale') resize();
  if (key === 'bg' || key === 'fps' || key === 'bgImg') { refreshVisibility(); updateStatus(); }
  if (key === 'bgImgSrc') loadBgImage();
  if (key === 'bg' && S.bg === 'transparent' && S.format === 'mp4') toast('MP4 has no alpha: use WebM for transparent');
  save();
}

/* ---------- panel / keys / toast ---------- */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('on'), 3200);
}
const hintEl = document.getElementById('hint');
let hintHidden = false;
function hideHint(){ if (!hintHidden) { hintHidden = true; setTimeout(() => hintEl.classList.add('gone'), 2500); } }

function setUi(show){ document.body.classList.toggle('hide-ui', !show); setTimeout(fitCanvas, 380); }
document.getElementById('hideUi').addEventListener('click', () => setUi(false));
document.getElementById('showUi').addEventListener('click', () => setUi(true));
addEventListener('keydown', e => {
  if ((e.target.matches && e.target.matches('input[type=text],textarea,select')) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') setUi(document.body.classList.contains('hide-ui'));
  else if (k === 'r') { e.preventDefault(); toggleRecord(); }
  else if (k === 'c') clearTrail();
  else if (k === 'i') playIntro();
  else if (k === 'p') snapshotPending = true;
});

const t = (k, v) => (window.t ? window.t(k, v) : k);
addEventListener('langchange', setRecUi);

/* ============================================================
   START
   ============================================================ */
if (innerWidth <= 760) document.body.classList.add('hide-ui');
buildUi();
loadBgImage();
resize();
requestAnimationFrame(frame);
setTimeout(playIntro, 300);
})();
</script>
</body>
