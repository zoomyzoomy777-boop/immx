name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          cp index.html immertechx.html i18n.js 2danimation.html memories-of-sacrifice.html tonkao.html .nojekyll _site/
          cp -r img models _site/
          mkdir _site/2Dani
          cp -r 2Dani/gallery-data.js 2Dani/preview 2Dani/web _site/2Dani/
          mkdir _site/work
          cp -r work/memories-of-sacrifice _site/work/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
